[project]
name = "milvus-ingest"
version = "0.1.2"
description = "High-performance data ingestion tool for Milvus vector database with vectorized operations, schema management, and comprehensive data verification"
keywords = ["milvus", "vector-database", "data-ingestion", "bulk-import", "data-generation", "high-performance", "vectorization", "etl", "schema-management", "data-verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Benchmark",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "faker>=23.0.0",
    "numpy>=1.24.0", 
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "pymilvus[bulk_writer]",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "loguru>=0.7.3",
    "boto3>=1.28.0",
    "ml-dtypes>=0.5.1",
]
requires-python = ">=3.10"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/mmga-lab/milvus-ingest"
Repository = "https://github.com/mmga-lab/milvus-ingest"
Documentation = "https://github.com/mmga-lab/milvus-ingest/blob/main/docs/README.md"
Issues = "https://github.com/mmga-lab/milvus-ingest/issues"

[[project.authors]]
name = "zhuwenxing"
email = "wenxing.zhu@zilliz.com"

[project.license]
text = "MIT"

[project.scripts]
milvus-ingest = "milvus_ingest.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "ty>=0.0.13",
    "twine>=6.1.0",
    "pytest-xdist>=3.8.0",
    "psutil>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".mypy_cache", ".nox", ".pants.d", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH"]
ignore = ["E501", "B008", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["milvus_ingest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')", "integration: marks tests as integration tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if self.debug:", "if settings.DEBUG", "raise AssertionError", "raise NotImplementedError", "if 0:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.11.5",
]

[tool.maturin]
# Python source directory
python-source = "src"
# Rust extension module name (will be importable as milvus_ingest._rust)
module-name = "milvus_ingest._rust"
# Build features
features = ["pyo3/extension-module"]
# Rust crate location
manifest-path = "rust/milvus_ingest_core/Cargo.toml"
# Include Python files
python-packages = ["milvus_ingest"]
# Strip symbols for smaller binaries
strip = true
