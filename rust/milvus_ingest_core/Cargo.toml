[package]
name = "milvus_ingest_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance Rust core for milvus-ingest data generation"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# Half-precision floating point
half = { version = "2.4", features = ["std", "num-traits"] }

# Parallelism
rayon = "1.10"

# Random number generation
rand = "0.8"
rand_xoshiro = "0.6"

# Serialization for JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hash map with better performance
ahash = "0.8"
indexmap = "2.7"

# Lazy static initialization
once_cell = "1.20"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.release.package."*"]
opt-level = 3
